services:
  postgres:
    image: postgres:16
    container_name: ds-postgres
    environment:
      POSTGRES_USER: ds
      POSTGRES_PASSWORD: ds
      POSTGRES_DB: ds
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ds -d ds"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
